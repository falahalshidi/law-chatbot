<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث كلمة مرور المدير</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
        }
        .container {
            border: 2px solid black;
            border-radius: 16px;
            padding: 30px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: black;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #333;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
        }
        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تحديث كلمة مرور المدير</h1>
        <p>أدخل كلمة المرور الجديدة للمدير (admin@example.com):</p>
        <input type="password" id="password" placeholder="كلمة المرور الجديدة">
        <button onclick="hashAndShow()">إنشاء Hash</button>
        <div id="result"></div>
        <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
            <p><strong>بعد الحصول على Hash، نفذ هذا الأمر في Supabase SQL Editor:</strong></p>
            <pre id="sql" style="background: white; padding: 10px; border-radius: 4px; overflow-x: auto;"></pre>
        </div>
    </div>

    <script>
        async function hashPassword(password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const encoder = new TextEncoder();
            const passwordData = encoder.encode(password);
            
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                passwordData,
                'PBKDF2',
                false,
                ['deriveBits']
            );
            
            const hashBuffer = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                256
            );
            
            const saltBase64 = btoa(String.fromCharCode(...salt));
            const hashBase64 = btoa(String.fromCharCode(...new Uint8Array(hashBuffer)));
            
            return `${saltBase64}:${hashBase64}`;
        }

        async function hashAndShow() {
            const password = document.getElementById('password').value;
            if (!password) {
                alert('يرجى إدخال كلمة المرور');
                return;
            }

            try {
                const hashed = await hashPassword(password);
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `<strong>Hash تم إنشاؤه بنجاح:</strong><br><code>${hashed}</code>`;
                
                const sqlDiv = document.getElementById('sql');
                sqlDiv.textContent = `UPDATE users 
SET password_hash = '${hashed}'
WHERE email = 'admin@example.com';`;
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.textContent = 'حدث خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>
