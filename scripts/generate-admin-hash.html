<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء Hash لكلمة مرور المدير</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: white;
        }
        .container {
            border: 2px solid black;
            border-radius: 16px;
            padding: 30px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: black;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #333;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>إنشاء Hash لكلمة مرور المدير</h1>
        <p>أدخل كلمة المرور للمدير (admin@example.com):</p>
        <input type="password" id="password" placeholder="كلمة المرور (مثلاً: admin123)" value="admin123">
        <button onclick="generateHash()">إنشاء Hash وتحديث قاعدة البيانات</button>
        <div id="result"></div>
    </div>

    <script>
        async function hashPassword(password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const encoder = new TextEncoder();
            const passwordData = encoder.encode(password);
            
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                passwordData,
                'PBKDF2',
                false,
                ['deriveBits']
            );
            
            const hashBuffer = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                keyMaterial,
                256
            );
            
            const saltBase64 = btoa(String.fromCharCode(...salt));
            const hashBase64 = btoa(String.fromCharCode(...new Uint8Array(hashBuffer)));
            
            return `${saltBase64}:${hashBase64}`;
        }

        async function generateHash() {
            const password = document.getElementById('password').value;
            if (!password) {
                alert('يرجى إدخال كلمة المرور');
                return;
            }

            try {
                const hashed = await hashPassword(password);
                const resultDiv = document.getElementById('result');
                
                resultDiv.innerHTML = `
                    <h3>✅ تم إنشاء Hash بنجاح!</h3>
                    <p><strong>Hash:</strong></p>
                    <pre>${hashed}</pre>
                    <p><strong>انسخ الأمر التالي والصقه في Supabase SQL Editor:</strong></p>
                    <pre>UPDATE users 
SET password_hash = '${hashed}'
WHERE email = 'admin@example.com';</pre>
                    <p style="color: #856404; background: #fff3cd; padding: 10px; border-radius: 8px; border: 1px solid #ffc107;">
                        ⚠️ <strong>مهم:</strong> بعد تنفيذ الأمر، استخدم كلمة المرور: <strong>${password}</strong> لتسجيل الدخول
                    </p>
                `;
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.style.background = '#f8d7da';
                resultDiv.style.borderColor = '#dc3545';
                resultDiv.style.color = '#721c24';
                resultDiv.textContent = 'حدث خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>
