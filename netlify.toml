[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["cohere-ai", "ollama"]

[build.environment]
  # ChromaDB Configuration - Set these in Netlify Dashboard > Site settings > Environment variables
  # CHROMADB_API_KEY = "your-api-key-here"
  # CHROMADB_TENANT = "your-tenant-id-here"
  # CHROMADB_DATABASE = "your-database-name-here"
  # OpenRouter Configuration
  # OPENROUTER_API_KEY = "your-openrouter-api-key-here"
  OPENROUTER_MODEL = "z-ai/glm-4.5-air:free"

# Redirect API calls to Netlify Functions (must come before catch-all)
# Use force=true to ensure redirects are applied even if path exists
[[redirects]]
  from = "/api/upload-file"
  to = "/.netlify/functions/upload-file"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Generic API redirect for any other /api/* routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Catch-all redirect for SPA (must come last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
