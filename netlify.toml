[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["cohere-ai", "ollama"]
  included_files = ["netlify/functions/**"]

[build.environment]
  # ChromaDB Configuration
  CHROMADB_API_KEY = "ck-3EDSUCED38no4aLq8rgMXzTwe14fvnATpGEkwWMgrkEV"
  CHROMADB_TENANT = "bf8e9ba0-6e6f-4365-a930-2c5ef360f292"
  CHROMADB_DATABASE = "lawchat"
  # OpenRouter Configuration
  OPENROUTER_API_KEY = "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"
  OPENROUTER_MODEL = "z-ai/glm-4.5-air:free"

# Redirect API calls to Netlify Functions (must come before catch-all)
# Use force=true to ensure redirects are applied even if path exists
[[redirects]]
  from = "/api/upload-file"
  to = "/.netlify/functions/upload-file"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Generic API redirect for any other /api/* routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Catch-all redirect for SPA (must come last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
